name: Validate preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native metadata tests
        if: runner.os == 'Linux'
        run: bash tests/run_native_tests.sh
      - name: Public tree and site checks
        run: python -B tools/check_public_tree.py
